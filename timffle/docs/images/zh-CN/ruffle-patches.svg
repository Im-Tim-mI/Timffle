<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="822" viewBox="0 0 1200 822" role="img" aria-label="Timffle 对 Ruffle 的修补" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, &apos;Noto Sans CJK SC&apos;, &apos;Noto Sans SC&apos;, &apos;Segoe UI&apos;, sans-serif">
<title>Timffle 对 Ruffle 的修补</title>
<defs><pattern id="pg" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#58A55C"/><rect width="6" height="12" fill="#4A9150"/></pattern><pattern id="py" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFD038"/><rect width="6" height="12" fill="#F0BC18"/></pattern><pattern id="po" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#F28C3A"/><rect width="6" height="12" fill="#DD7A2C"/></pattern></defs>
<rect width="1200" height="822" rx="18" fill="#163A61"/>
<text x="28.0" y="52.0" font-size="32" fill="#FFD038" font-weight="bold" text-anchor="start">Timffle 对 Ruffle 的修补</text>
<text x="28.0" y="84.0" font-size="15" fill="#A9C6E6" font-weight="normal" text-anchor="start">基底：Ruffle nightly-2026-10-13（46fec3f）　统计日期：2026-10-25</text>
<rect x="28" y="112" width="560" height="260" rx="14" fill="#1F4A78"/>
<rect x="459.9" y="132" width="106.1" height="28" rx="7" fill="#2E5A8C"/>
<text x="513.0" y="151.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">stub-report</text>
<text x="54.0" y="154.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">AVM2 API（ActionScript 3）</text>
<text x="54.0" y="188.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">用 Ruffle 官网同一套工具统计 Flash Player API 的实现程度。Timffle</text>
<text x="54.0" y="212.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">把 23 个原本是空壳或缺少的 API 补成完整实现，集中在 3D 与网络。</text>
<text x="54.0" y="244.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">统计范围：全部 AVM2 API（4,560 项）</text>
<text x="54.0" y="283.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Ruffle：82.1%</text>
<clipPath id="bzh-CN7"><rect x="232.0" y="270" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="270" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="232.00" y="270" width="270.80" height="16" fill="url(#pg)" clip-path="url(#bzh-CN7)"/>
<rect x="502.80" y="270" width="31.84" height="16" fill="url(#po)" clip-path="url(#bzh-CN7)"/>
<text x="54.0" y="317.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Timffle：82.6%</text>
<clipPath id="bzh-CN8"><rect x="232.0" y="304" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="304" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
