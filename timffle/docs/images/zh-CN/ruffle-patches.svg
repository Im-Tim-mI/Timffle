<rect x="521.47" y="612" width="28.95" height="16" fill="url(#po)" clip-path="url(#bzh-CN12)"/>
<rect x="612" y="396" width="560" height="324" rx="14" fill="#1F4A78"/>
<rect x="988.5" y="416" width="161.5" height="28" rx="7" fill="#2E5A8C"/>
<text x="1069.2" y="435.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">0001・0002・0005</text>
<text x="638.0" y="438.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">API 统计看不到的修补</text>
<text x="638.0" y="474.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="474.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Socket（TCP）连接：用连接助手直接连游戏服务器</text>
<text x="638.0" y="500.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="500.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">中文：_sans／_serif 不再让中文消失，按 Windows 字体排版</text>
<text x="638.0" y="526.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="526.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">域名查找改成父域优先，库里的同名函数不再覆盖内置函数</text>
<text x="638.0" y="552.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="552.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">网页版递归保护：抛出可捕获的错误，不再整个卡死</text>
<text x="638.0" y="578.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="578.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">AMF3 编码器的引用索引（rust-flash-lso）</text>
<text x="638.0" y="604.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="604.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">只有 256 个顶点 uniform 的旧 GPU 也能绘制</text>
<text x="638.0" y="630.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="630.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">标签页在后台时不绘制画面</text>
<text x="638.0" y="662.0" font-size="14" fill="#A9C6E6" font-weight="normal" text-anchor="start">Ruffle 引擎：53 个文件，+3,940／−853 行</text>
<text x="638.0" y="684.0" font-size="14" fill="#A9C6E6" font-weight="normal" text-anchor="start">Chrome 扩展程序：108 个文件，+27,383／−455 行</text>
<rect x="28" y="745" width="30" height="14" rx="7" fill="url(#pg)"/>
<text x="68.0" y="758.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Ruffle 原本就有</text>
<rect x="204.66" y="745" width="30" height="14" rx="7" fill="url(#py)"/>
<text x="244.7" y="758.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Timffle 修补</text>
<rect x="357.25" y="745" width="30" height="14" rx="7" fill="url(#po)"/>
<text x="397.2" y="758.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">空壳（部分实现）</text>
<rect x="547.25" y="745" width="30" height="14" rx="7" fill="#DCE7F3"/>
<text x="587.2" y="758.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">缺少</text>
<text x="28.0" y="788.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">API 统计只看有没有实现、是不是空壳，不代表行为完全相同；行为以真 Flash Player 32 的 30 份黄金答案验证。</text>
</svg>
