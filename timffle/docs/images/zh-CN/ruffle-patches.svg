<rect x="502.80" y="304" width="1.66" height="16" fill="url(#py)" clip-path="url(#bzh-CN8)"/>
<rect x="504.47" y="304" width="30.54" height="16" fill="url(#po)" clip-path="url(#bzh-CN8)"/>
<rect x="612" y="112" width="560" height="260" rx="14" fill="#1F4A78"/>
<rect x="1088.2" y="132" width="61.8" height="28" rx="7" fill="#2E5A8C"/>
<text x="1119.1" y="151.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">0004</text>
<text x="638.0" y="154.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">3D 与 Matrix3D</text>
<text x="638.0" y="188.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">游戏登录画面的 3D 转盘等。补齐 Flash 的 3D 模型：z、</text>
<text x="638.0" y="212.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">rotationX/Y/Z、scaleZ、matrix3D、透视投影、Matrix3D、Utils3D，</text>
<text x="638.0" y="236.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">以及投影后的边界、命中测试与 BitmapData.draw。</text>
<text x="638.0" y="268.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">统计范围：3D API（79 项）　真 Flash 黄金答案：15 份</text>
<text x="638.0" y="307.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Ruffle：79.7%</text>
<clipPath id="bzh-CN9"><rect x="816.0" y="294" width="330.0" height="16" rx="8"/></clipPath>
<rect x="816.0" y="294" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="816.00" y="294" width="263.16" height="16" fill="url(#pg)" clip-path="url(#bzh-CN9)"/>
<rect x="1079.16" y="294" width="62.66" height="16" fill="url(#po)" clip-path="url(#bzh-CN9)"/>
<text x="638.0" y="341.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Timffle：100%</text>
<clipPath id="bzh-CN10"><rect x="816.0" y="328" width="330.0" height="16" rx="8"/></clipPath>
<rect x="816.0" y="328" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="816.00" y="328" width="263.16" height="16" fill="url(#pg)" clip-path="url(#bzh-CN10)"/>
<rect x="1079.16" y="328" width="66.84" height="16" fill="url(#py)" clip-path="url(#bzh-CN10)"/>
<rect x="28" y="396" width="560" height="324" rx="14" fill="#1F4A78"/>
<rect x="504.2" y="416" width="61.8" height="28" rx="7" fill="#2E5A8C"/>
<text x="535.1" y="435.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">0003</text>
<text x="54.0" y="438.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">网络、加载与 LocalConnection</text>
<text x="54.0" y="472.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">LocalConnection 的循环引用与消息上限、URLStream 渐进传输、</text>
<text x="54.0" y="496.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">Loader／URLLoader 真正取消、URLLoader 的 open 时机、AMF3 循</text>
<text x="54.0" y="520.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">环引用。</text>
<text x="54.0" y="552.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">统计范围：4 个类别（57 项）　真 Flash 黄金答案：14 份</text>
<text x="54.0" y="591.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Ruffle：75.4%</text>
<clipPath id="bzh-CN11"><rect x="232.0" y="578" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="578" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="232.00" y="578" width="248.95" height="16" fill="url(#pg)" clip-path="url(#bzh-CN11)"/>
<rect x="480.95" y="578" width="46.32" height="16" fill="url(#po)" clip-path="url(#bzh-CN11)"/>
<text x="54.0" y="625.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Timffle：87.7%</text>
<clipPath id="bzh-CN12"><rect x="232.0" y="612" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="612" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
