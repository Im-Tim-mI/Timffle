<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1121" viewBox="0 0 1200 1121" role="img" aria-label="What Timffle patches in Ruffle" font-family="&apos;Segoe UI&apos;, -apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Arial, sans-serif">
<title>What Timffle patches in Ruffle</title>
<defs><pattern id="pg" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#58A55C"/><rect width="6" height="12" fill="#4A9150"/></pattern><pattern id="py" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFD038"/><rect width="6" height="12" fill="#F0BC18"/></pattern><pattern id="po" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#F28C3A"/><rect width="6" height="12" fill="#DD7A2C"/></pattern></defs>
<rect width="1200" height="1121" rx="18" fill="#163A61"/>
<text x="28.0" y="52.0" font-size="32" fill="#FFD038" font-weight="bold" text-anchor="start">What Timffle patches in Ruffle</text>
<text x="28.0" y="84.0" font-size="15" fill="#A9C6E6" font-weight="normal" text-anchor="start">Base: Ruffle nightly-2026-10-13 (46fec3f) · Measured: 2026-11-06</text>
<rect x="28" y="112" width="560" height="308" rx="14" fill="#1F4A78"/>
<rect x="459.9" y="132" width="106.1" height="28" rx="7" fill="#2E5A8C"/>
<text x="513.0" y="151.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">stub-report</text>
<text x="54.0" y="154.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">AVM2 API (ActionScript 3)</text>
<text x="54.0" y="188.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">Measured with the same tool as Ruffle's website. Timffle gives all</text>
<text x="54.0" y="212.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">799 Flash Player APIs that were stubs or missing an</text>
<text x="54.0" y="236.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">implementation, so the tool now finds none missing and no stubs.</text>
<text x="54.0" y="260.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">That counts APIs, not behaviour: some run without the hardware</text>
<text x="54.0" y="284.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">(camera, DRM) a real Flash had.</text>
<text x="54.0" y="316.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">Scope: all AVM2 APIs (4,560 items)</text>
<text x="54.0" y="355.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Ruffle: 82.1%</text>
<clipPath id="ben7"><rect x="232.0" y="342" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="342" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="232.00" y="342" width="270.80" height="16" fill="url(#pg)" clip-path="url(#ben7)"/>
<rect x="502.80" y="342" width="31.84" height="16" fill="url(#po)" clip-path="url(#ben7)"/>
<text x="54.0" y="389.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Timffle: 100%</text>
<clipPath id="ben8"><rect x="232.0" y="376" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="376" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="232.00" y="376" width="270.80" height="16" fill="url(#pg)" clip-path="url(#ben8)"/>
<rect x="502.80" y="376" width="59.20" height="16" fill="url(#py)" clip-path="url(#ben8)"/>
<rect x="612" y="112" width="560" height="308" rx="14" fill="#1F4A78"/>
<rect x="1088.2" y="132" width="61.8" height="28" rx="7" fill="#2E5A8C"/>
<text x="1119.1" y="151.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">0004</text>
<text x="638.0" y="154.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">3D and Matrix3D</text>
<text x="638.0" y="188.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">Such as the 3D carousel on a game's login page. Fills in Flash's</text>
<text x="638.0" y="212.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">3D model: z, rotationX/Y/Z, scaleZ, matrix3D, perspective</text>
<text x="638.0" y="236.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">projection, Matrix3D, Utils3D, and projected bounds, hit testing</text>
<text x="638.0" y="260.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">and BitmapData.draw.</text>
<text x="638.0" y="292.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">Scope: 3D APIs (79 items) · Golden files from real Flash: 17</text>
<text x="638.0" y="331.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Ruffle: 79.7%</text>
<clipPath id="ben9"><rect x="816.0" y="318" width="330.0" height="16" rx="8"/></clipPath>
<rect x="816.0" y="318" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="816.00" y="318" width="263.16" height="16" fill="url(#pg)" clip-path="url(#ben9)"/>
<rect x="1079.16" y="318" width="62.66" height="16" fill="url(#po)" clip-path="url(#ben9)"/>
<text x="638.0" y="365.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Timffle: 100%</text>
<clipPath id="ben10"><rect x="816.0" y="352" width="330.0" height="16" rx="8"/></clipPath>
<rect x="816.0" y="352" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="816.00" y="352" width="263.16" height="16" fill="url(#pg)" clip-path="url(#ben10)"/>
<rect x="1079.16" y="352" width="66.84" height="16" fill="url(#py)" clip-path="url(#ben10)"/>
<rect x="28" y="444" width="560" height="575" rx="14" fill="#1F4A78"/>
<rect x="504.2" y="464" width="61.8" height="28" rx="7" fill="#2E5A8C"/>
<text x="535.1" y="483.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">0003</text>
<text x="54.0" y="486.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">Networking and LocalConnection</text>
<text x="54.0" y="520.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">LocalConnection reference cycles and size limit, progressive</text>
<text x="54.0" y="544.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">URLStream, real Loader/URLLoader cancellation, URLLoader</text>
<text x="54.0" y="568.0" font-size="16" fill="#EAF2FB" font-weight="normal" text-anchor="start">open timing, AMF3 reference cycles.</text>
<text x="54.0" y="600.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">Scope: 4 classes (57 items) · Golden files from real Flash: 14</text>
<text x="54.0" y="639.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Ruffle: 75.4%</text>
<clipPath id="ben11"><rect x="232.0" y="626" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="626" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="232.00" y="626" width="248.95" height="16" fill="url(#pg)" clip-path="url(#ben11)"/>
<rect x="480.95" y="626" width="46.32" height="16" fill="url(#po)" clip-path="url(#ben11)"/>
<text x="54.0" y="673.0" font-size="16" fill="#FFD038" font-weight="bold" text-anchor="start">Timffle: 100%</text>
<clipPath id="ben12"><rect x="232.0" y="660" width="330.0" height="16" rx="8"/></clipPath>
<rect x="232.0" y="660" width="330.0" height="16" rx="8" fill="#DCE7F3"/>
<rect x="232.00" y="660" width="248.95" height="16" fill="url(#pg)" clip-path="url(#ben12)"/>
<rect x="480.95" y="660" width="81.05" height="16" fill="url(#py)" clip-path="url(#ben12)"/>
<rect x="612" y="444" width="560" height="575" rx="14" fill="#1F4A78"/>
<rect x="984.0" y="464" width="166.0" height="28" rx="7" fill="#2E5A8C"/>
<text x="1067.0" y="483.0" font-size="14" fill="#E9F2FB" font-weight="normal" text-anchor="middle">0001 · 0002 · 0005</text>
<text x="638.0" y="486.0" font-size="25" fill="#FFD038" font-weight="bold" text-anchor="start">Beyond the API count</text>
<text x="638.0" y="522.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="522.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Socket (TCP): the connection helper reaches game servers</text>
<text x="662.0" y="545.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">directly</text>
<text x="638.0" y="571.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="571.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Chinese text: _sans/_serif no longer drop it; Windows font</text>
<text x="662.0" y="594.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">metrics</text>
<text x="638.0" y="620.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="620.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Domain lookup is parent-first: a library can't shadow built-ins</text>
<text x="638.0" y="646.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="646.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Recursion guard on the web: a catchable error, not a dead</text>
<text x="662.0" y="669.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">player</text>
<text x="638.0" y="695.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="695.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">AMF3 encoder reference indices (rust-flash-lso)</text>
<text x="638.0" y="721.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="721.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Old GPUs with 256 vertex uniform vectors can draw</text>
<text x="638.0" y="747.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="747.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">No drawing while the tab is in the background</text>
<text x="638.0" y="773.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="773.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">WebGPU first; blends resolve only the rectangle they need</text>
<text x="638.0" y="799.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="799.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Synchronous GPU readback and PixelBender on browser WebGPU</text>
<text x="638.0" y="825.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="825.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Events run before the frame: pictures show end-of-frame state</text>
<text x="638.0" y="851.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="851.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Input-method composition (Chinese) in Flash text fields</text>
<text x="638.0" y="877.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="877.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Loader content is built after the enterFrame event, as in Flash</text>
<text x="638.0" y="903.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="903.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">JPEG XR encoder, byte-identical to Flash 32</text>
<text x="638.0" y="929.0" font-size="16" fill="#7BD389" font-weight="bold" text-anchor="start">✓</text>
<text x="662.0" y="929.0" font-size="15.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">The plugin reports Flash 32; a page that refuses it gets 34</text>
<text x="638.0" y="961.0" font-size="14" fill="#A9C6E6" font-weight="normal" text-anchor="start">Ruffle engine: 439 files, +40,116/−4,956 lines</text>
<text x="638.0" y="983.0" font-size="14" fill="#A9C6E6" font-weight="normal" text-anchor="start">Chrome extension: 113 files, +28,430/−509 lines</text>
<rect x="28" y="1044" width="30" height="14" rx="7" fill="url(#pg)"/>
<text x="68.0" y="1057.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">In Ruffle</text>
<rect x="164.06" y="1044" width="30" height="14" rx="7" fill="url(#py)"/>
<text x="204.1" y="1057.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Patched by Timffle</text>
<rect x="363.05" y="1044" width="30" height="14" rx="7" fill="url(#po)"/>
<text x="403.1" y="1057.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Stub (partial)</text>
<rect x="528.98" y="1044" width="30" height="14" rx="7" fill="#DCE7F3"/>
<text x="569.0" y="1057.0" font-size="14.5" fill="#EAF2FB" font-weight="normal" text-anchor="start">Missing</text>
<text x="28.0" y="1087.0" font-size="13.5" fill="#A9C6E6" font-weight="normal" text-anchor="start">The API count only checks whether each API is implemented or a stub, not that it behaves exactly like Flash; behaviour is checked against 47 golden files from Flash Player 32.</text>
</svg>
