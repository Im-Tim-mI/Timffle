<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Timffle</title>
        <link rel="icon" type="image/png" href="images/icon32.png" />
        <link rel="stylesheet" href="css/common.css" />
        <link rel="stylesheet" href="css/prompt.css" />
    </head>
    <body>
        <main id="prompt" role="alertdialog" aria-labelledby="prompt-title" aria-describedby="prompt-warning" hidden>
            <img src="images/logo.svg" alt="Timffle" class="logo" />
            <h1 id="prompt-title" data-i18n="timffle_prompt_title"></h1>
            <p id="prompt-origin" class="origin" translate="no" dir="ltr"></p>
            <p id="prompt-embedded" class="embedded" hidden>
                <span data-i18n="timffle_prompt_embedded"></span>
                <bdi id="prompt-embedded-origin" translate="no"></bdi>
            </p>
            <p id="prompt-what" class="what" data-i18n="timffle_prompt_what"></p>
            <div id="prompt-warning" class="warning">
                <p data-i18n-rich="timffle_prompt_warning"><strong></strong></p>
            </div>
            <div class="buttons">
                <button type="button" id="deny-once" class="recommended" data-choice="deny-once">
                    <span data-i18n="timffle_prompt_deny_once"></span>
                    <small data-i18n="timffle_prompt_visit_hint"></small>
                </button>
                <button type="button" id="allow-once" data-choice="allow-once">
                    <span data-i18n="timffle_allow"></span>
                    <small data-i18n="timffle_prompt_visit_hint"></small>
                </button>
                <button type="button" id="deny-always" data-choice="deny-always">
                    <span data-i18n="timffle_choice_deny"></span>
                    <small data-i18n="timffle_prompt_deny_always_hint"></small>
                </button>
                <button type="button" id="allow-always" data-choice="allow-always">
                    <span data-i18n="timffle_choice_allow"></span>
                    <small data-i18n="timffle_prompt_allow_always_hint"></small>
                </button>
            </div>
            <p class="detail" data-i18n="timffle_prompt_detail"></p>
            <p id="prompt-error" class="error" role="alert" hidden></p>
        </main>
        <main id="helper" role="alertdialog" aria-labelledby="helper-title" aria-describedby="helper-text" hidden>
            <img src="images/logo.svg" alt="Timffle" class="logo" />
            <h1 id="helper-title" data-i18n="timffle_helper_prompt_title"></h1>
            <p id="helper-origin" class="origin" translate="no" dir="ltr"></p>
            <p id="helper-embedded" class="embedded" hidden>
                <span data-i18n="timffle_prompt_embedded"></span>
                <bdi id="helper-embedded-origin" translate="no"></bdi>
            </p>
            <div class="warning">
                <p id="helper-text" role="status"></p>
            </div>
            <div class="helper-actions">
                <button type="button" id="helper-download" class="recommended" data-i18n="timffle_helper_notice_button" hidden></button>
                <p class="helper-small"><span id="helper-for" hidden></span><button type="button" id="helper-more" class="link" data-i18n="timffle_helper_download_more"></button></p>
                <p id="helper-step" class="helper-step" hidden><code dir="ltr" translate="no"></code></p>
                <p id="helper-wait" class="helper-wait" role="status" aria-live="polite" data-state="waiting" data-i18n="timffle_helper_waiting"></p>
                <div class="helper-end">
                    <button type="button" id="helper-close" data-i18n="timffle_close"></button>
                    <button type="button" id="helper-continue" data-i18n="timffle_helper_continue" disabled></button>
                </div>
            </div>
            <p class="detail" data-i18n="timffle_helper_page_safe"></p>
        </main>
        <main id="expired" hidden>
            <p data-i18n="timffle_prompt_expired"></p>
            <button type="button" id="close-window" data-i18n="timffle_close"></button>
        </main>
        <script src="dist/prompt.js"></script>
    </body>
</html>
