<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Timffle Settings</title>
        <link rel="icon" type="image/png" href="images/icon32.png" />
        <link rel="stylesheet" href="css/common.css" />
        <link rel="stylesheet" href="css/options.css" />
    </head>
    <body>
        <div class="header">
            <a href="https://github.com/Im-Tim-mI/Timffle" target="_blank">
                <img src="images/logo.svg" alt="Timffle" data-canonical-src="images/logo.svg" class="logo" />
            </a>
            <div id="version-text">nightly YYYY-MM-DD</div>
        </div>
        <div class="options container">
            <div class="option checkbox">
                <input type="checkbox" id="ruffle_enable" />
                <label for="ruffle_enable">Play Flash content in Timffle</label>
            </div>
            <div class="option checkbox">
                <input type="checkbox" id="show_swf_download" />
                <label for="show_swf_download">Show SWF download in context menu</label>
            </div>
            <div class="option checkbox">
                <input type="checkbox" id="autostart" />
                <label for="autostart">Autoplay Flash content (click to unmute)</label>
            </div>
            <div class="option checkbox">
                <input type="checkbox" id="swf_takeover" />
                <label for="swf_takeover">Play SWF files in browser instead of downloading</label>
            </div>
            <div id="advanced-options">Advanced Options</div>
            <div class="option checkbox">
                <input type="checkbox" id="ignore_optout" />
                <label for="ignore_optout">Play Flash content even on sites that disallow Timffle</label>
            </div>
            <div class="option select">
                <select id="log_level">
                    <option value="error" id="log_level_error">Error</option>
                    <option value="warn" id="log_level_warn">Warning</option>
                    <option value="info" id="log_level_info">Info</option>
                    <option value="debug" id="log_level_debug">Debug</option>
                    <option value="trace" id="log_level_trace">Trace</option>
                </select>
                <label for="log_level">Log level</label>
            </div>
            <div class="option select">
                <select id="background_execution_mode">
                    <option value="none" id="background_execution_mode_none">Pause</option>
                    <option value="mainThread" id="background_execution_mode_main_thread">Run in the main thread</option>
                </select>
                <label for="background_execution_mode">Background execution</label>
            </div>
            <div class="option select">
                <select id="preferred_renderer">
                    <option value="" id="preferred_renderer_auto">Automatic</option>
                    <option value="webgpu">WebGPU</option>
                    <option value="wgpu-webgl">wgpu (via WebGL)</option>
                    <option value="webgl">WebGL</option>
                    <option value="canvas">Canvas2D</option>
                </select>
                <label for="preferred_renderer">Preferred renderer</label>
            </div>
            <div class="option select">
                <select id="device_font_renderer">
                    <option value="embedded" id="device_font_renderer_embedded">Embedded</option>
                    <option value="canvas">Canvas</option>
                </select>
                <label for="device_font_renderer">Device font renderer</label>
            </div>
            <div class="option number-input">
                <input type="number" id="player_version" min="1" max="32" placeholder="32" />
                <label for="player_version">Flash player version number to emulate (range 1-32)</label>
            </div>
            <div class="option number-input">
                <input type="number" id="max_execution_duration" min="1" />
                <label for="max_execution_duration">Maximum allowed ActionScript execution duration (in seconds)</label>
            </div>
            <form id="socket-proxy-form" class="proxy-settings" autocomplete="off" aria-labelledby="socket-proxy-title">
                <h2 id="socket-proxy-title" data-i18n="timffle_options_title"></h2>
                <label class="proxy-toggle" for="socket-proxy-enabled">
                    <input type="checkbox" id="socket-proxy-enabled" />
                    <span data-i18n="timffle_options_enable"></span>
                </label>
                <fieldset class="proxy-mode">
                    <legend data-i18n="timffle_options_method"></legend>
                    <label for="socket-proxy-mode-helper">
                        <input type="radio" name="socket-proxy-mode" id="socket-proxy-mode-helper" value="helper" />
                        <span data-i18n="timffle_options_helper"></span>
                    </label>
                    <div class="helper-status">
                        <p id="socket-helper-status" role="status" aria-live="polite" data-i18n="timffle_helper_checking"></p>
                        <button type="button" id="socket-helper-check" data-i18n="timffle_helper_check"></button>
                        <button type="button" id="socket-helper-install" data-i18n="timffle_helper_notice_button" hidden></button>
                    </div>
                    <label for="socket-proxy-mode-websocket">
                        <input type="radio" name="socket-proxy-mode" id="socket-proxy-mode-websocket" value="websocket" />
                        <span data-i18n="timffle_options_websocket"></span>
                    </label>
                </fieldset>
                <div id="socket-proxy-websocket-fields">
                    <label for="socket-proxy-url" data-i18n="timffle_options_url"></label>
                    <input type="password" id="socket-proxy-url" dir="ltr" autocomplete="new-password" spellcheck="false" autocapitalize="off" aria-describedby="socket-proxy-url-help" />
                    <p id="socket-proxy-url-help">
                        <span data-i18n="timffle_options_url_help"></span><br />
                        <span data-i18n="timffle_options_example"></span> <code translate="no" dir="ltr">ws://127.0.0.1:18770/connect?host={host}&amp;port={port}&amp;token=&lt;your-token&gt;</code>
                    </p>
                </div>
                <label for="socket-proxy-origins">
                    <span data-mode-text="helper" data-i18n="timffle_options_allowed_helper"></span>
                    <span data-mode-text="websocket" data-i18n="timffle_options_allowed_proxy" hidden></span>
                </label>
                <textarea id="socket-proxy-origins" dir="ltr" rows="8" spellcheck="false" autocapitalize="off" placeholder="https://trusted.example" aria-describedby="socket-proxy-origin-help"></textarea>
                <p id="socket-proxy-origin-help" data-i18n="timffle_options_allowed_help"></p>
                <p id="socket-proxy-origin-mode-help" data-mode-text="websocket" data-i18n="timffle_options_proxy_list_help" hidden></p>
                <label for="socket-proxy-denied" data-i18n="timffle_options_denied"></label>
                <textarea id="socket-proxy-denied" dir="ltr" rows="4" spellcheck="false" autocapitalize="off" placeholder="https://untrusted.example" aria-describedby="socket-proxy-denied-help"></textarea>
                <p id="socket-proxy-denied-help" data-i18n="timffle_options_denied_help"></p>
                <ul class="proxy-notes">
                    <li data-i18n="timffle_note_ask"></li>
                    <li data-i18n="timffle_note_helper"></li>
                    <li data-i18n="timffle_note_public"></li>
                    <li data-i18n="timffle_note_proxy"></li>
                    <li data-i18n="timffle_note_reload"></li>
                </ul>
                <div class="proxy-actions">
                    <button type="submit" id="socket-proxy-save" data-i18n="timffle_options_save"></button>
                    <p id="socket-proxy-status" role="status" aria-live="polite" aria-atomic="true" data-i18n="timffle_loading"></p>
                </div>
            </form>
            <button id="reset-settings">Reset settings</button>
            <section id="promo" class="promo" aria-labelledby="promo-title" data-i18n-languages="en zh" hidden>
                <h2 id="promo-title" data-i18n="timffle_promo_title"></h2>
                <a class="promo-banner" href="https://store.logitech.tw/discount/LOGITIM" target="_blank" rel="noopener noreferrer"><img data-i18n-image="timffle_promo_image" data-i18n-alt="timffle_promo_image_alt" width="720" height="405" /></a>
                <p><a href="https://store.logitech.tw/discount/LOGITIM" target="_blank" rel="noopener noreferrer" data-i18n="timffle_promo_link"></a></p>
                <p class="promo-note" data-i18n="timffle_promo_disclaimer"></p>
            </section>
            <p class="timffle-attribution" data-i18n-rich="timffle_attribution">
                <a href="https://ruffle.rs/" target="_blank" rel="noopener noreferrer"></a>
                <a href="https://github.com/Im-Tim-mI/Timffle/issues" target="_blank" rel="noopener noreferrer"></a>
            </p>
        </div>
        <script src="dist/options.js"></script>
    </body>
</html>
