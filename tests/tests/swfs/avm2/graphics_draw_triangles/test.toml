num_ticks = 1

# Timffle: the shapes match Flash now (drawTriangles draws a union); only the anti-aliased
# diagonal edge pixels differ from Flash's rasterizer (max difference 97), so the tolerance
# is set above that and no outliers are allowed.
[image_comparisons.output]
trigger = 1
tolerance = 100

[player_options]
with_renderer = { optional = true, quality = "high" }
