# This is the SWF from the https://code.tutsplus.com/tutorials/build-a-stage3d-shoot-em-up-sprite-test--active-11005
# It performs Stage3D bitmap rendering, and uses multiple different VertexBuffers in the same pipeline
num_frames = 50
# Timffle: output.expected.png was recorded with Flash Player 32.0.0.465
# (standalone, Wine 11.19 on Xvfb; Context3D.driverInfo "DirectX11", wined3d
# OpenGL renderer on llvmpipe) from a copy of test.swf whose Math.random() returns avmplus's
# sequence for the seed this harness uses (DeterministicLocaleBackend, the
# same numbers Ruffle draws here) and whose enterFrame handlers stop after the
# 49th sprite update, i.e. the state Ruffle shows after 50 frames; the stage
# was read from the screen (twice, identical). Sprite positions match exactly.
# Outliers (colour channels > 16, GT 720 / NVK): 3,660 in the title text
# (device font _sans: Wine's Arial substitute in Flash, Ruffle's default font
# here) and 489 in two sprites whose size sits at the mipnearest
# switch point (level of detail 0.46 / 0.50, where GPUs round differently).

[image_comparisons.output]
tolerance = 16
max_outliers = 4500

[player_options]
with_renderer = { optional = false, quality = "low" }
# TODO Fix this test. It shouldn't depend on the default font.
with_default_font = true
