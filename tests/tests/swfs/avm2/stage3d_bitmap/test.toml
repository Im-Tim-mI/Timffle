# This is the SWF from the https://code.tutsplus.com/tutorials/build-a-stage3d-shoot-em-up-sprite-test--active-11005
# It performs Stage3D bitmap rendering, and uses multiple different VertexBuffers in the same pipeline
num_frames = 50
# Timffle: known failure since Stage3D textures have real mip chains. The SWF
# uploads its own mip levels and samples with <mipnearest>; the golden was
# rendered by Ruffle when only level 0 existed (forcing level-0 sampling makes
# it match again, max difference 2). Real Flash 32 does sample the uploaded
# levels (difftest d63stage3d, test stage3d_uploads_flash), so the golden no
# longer shows Flash's picture; it is kept unchanged until it is re-recorded.
# output.ruffle.png is Ruffle's current (mip-sampled) picture.

[image_comparisons.output]
tolerance = 4
max_outliers = 24
known_failure = true

[player_options]
with_renderer = { optional = false, quality = "low" }
# TODO Fix this test. It shouldn't depend on the default font.
with_default_font = true
