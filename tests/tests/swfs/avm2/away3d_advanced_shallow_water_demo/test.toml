num_ticks = 20
# Timffle: output.expected.png was recorded with Flash Player 32.0.0.465
# (standalone, Wine 11.19 on Xvfb, 2026-11-05, twice; identical except the
# stats overlay). Context3D there is Flash's software renderer ("Software"):
# with wined3d's Vulkan renderer Flash falls back to it, and on the DirectX 11
# path (wined3d OpenGL on llvmpipe) Wine fails to translate the water's
# fragment shader and the water is not drawn at all. The copy of test.swf
# used for the recording counts enterFrames: it waits before the 11th until
# the mouse button is down (pointer moved to 450,450 and pressed with XTest,
# as input.json does after tick 10, so the plane is picked during the 11th
# render as here) and stops updating after the 19th, the last one Ruffle runs
# in 20 ticks; the stage was then read from the screen. Picking and the
# brush agree exactly (plane point 0.46229746203597 / 0.2864573539918218,
# brush 31x31 in both). Outliers (colour channels > 30, GT 720 / NVK), 4,871:
# 1,633 in the AwayStats overlay (device font, and it prints the real FPS,
# memory and driverInfo; the harness pins System.totalMemory to 90 MiB and
# driverInfo to "Dummy"), 1,757 in the Away3D signature (vector logo and text
# drawn by BitmapData.draw at quality HIGH: anti-aliasing and ~1 px), 728 in
# the drop's reflection, the rest pool-edge and slider pixels.

[image_comparisons.output]
tolerance = 30
max_outliers = 5400

[player_options]
with_renderer = { optional = false, quality = "low" }
# TODO Fix this test. It shouldn't depend on the default font.
with_default_font = true
