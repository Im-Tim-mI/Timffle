num_frames = 5

# Timffle: output.expected.png was recorded with Flash Player 32.0.0.465
# (standalone, Wine 11.19 on Xvfb, 2026-11-05, twice, identical): test.swf
# loaded over HTTP by a Loader in a 443x150 wrapper SWF that sets
# stage.quality = LOW (the quality this test runs Ruffle at; opened as a local
# file the SWF draws nothing), read from the screen after the text settled.
# Still a known failure, for one difference in content: Flash's TLF shapes
# the text with the font's OpenType features, so "fi" in "DefineFont4." is
# the ligature glyph (no dot on the i) and the glyphs after it sit up to 1 px
# further left; Ruffle's FTE lays the text out glyph by glyph. Everything else
# matches: line origins, ink rows 31-71 / 84-117 (the descender of "g" was cut
# at row 69 until TextLines stopped clipping to their fallback field) and the
# glyph columns of the first line to within the pixel rounding of the edges.
# output.ruffle.png is Ruffle's current picture (GT 720 / NVK; 3,546 colour
# channels differ from Flash, 2,313 of them on the second line).

[image_comparisons.output]
tolerance = 1
known_failure = true

[player_options]
with_renderer = { optional = false, quality = "low" }
