num_frames = 5

# Timffle: output.expected.png was recorded with Flash Player 32.0.0.465
# (standalone, Wine 11.19 on Xvfb, 2026-11-05, twice, identical): test.swf
# loaded over HTTP by a Loader in a 443x150 wrapper SWF that sets
# stage.quality = LOW (the quality this test runs Ruffle at; opened as a local
# file the SWF draws nothing), read from the screen after the text settled.
# Still a known failure, for the rasterization of the glyph edges, not their content:
# the text is shaped with the font's OpenType tables like Flash's TLF (now
# "fi" is the ligature glyph and the glyphs after it sit where Flash puts them,
# same ink components and columns to within one pixel), but about 400 edge pixels
# per line still differ by one pixel on both lines (Flash's CFF rendering at low
# quality: stems and curve edges land on other pixels; rounding the glyph origins
# to whole device pixels would remove about a third of them, unverified as a rule).
# Line origins and ink rows 31-71 / 84-117 match. output.ruffle.png is Ruffle's
# current picture (GT 720 / NVK; 2,238 colour channels differ from Flash, 1,026 of
# them on the second line, which differed by 2,313 before the shaping).

[image_comparisons.output]
tolerance = 1
known_failure = true

[player_options]
with_renderer = { optional = false, quality = "low" }
